[package]
name = "bondry-local-server-ffi"
description = "Versioned C ABI for Bondry local REST and MCP servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["local-server"]
local-server = ["mcp", "raw-body", "rest"]
mcp = ["bondry-http-server/mcp", "dep:bondry-mcp-proto"]
raw-body = []
rest = ["bondry-http-server/rest", "dep:bondry-rest-proto"]
rest-server = ["rest", "bondry-http-server/unix-socket"]

[dependencies]
bondry-core = { version = "0.2.0", path = "../../contract/bondry-core" }
bondry-http-server = { version = "0.2.0", path = "../../engine/bondry-http-server", default-features = false }
bondry-mcp-proto = { version = "0.2.0", path = "../../proto/bondry-mcp-proto", optional = true }
bondry-rest-proto = { version = "0.2.0", path = "../../proto/bondry-rest-proto", optional = true }
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
bondry-runtime-ffi = { version = "0.2.0", path = "../bondry-runtime-ffi" }
tempfile.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
