[package]
name = "bondry-runtime-ffi"
description = "Versioned C ABI for the Bondry runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
bondry-auth = { version = "0.2.0", path = "../../contract/bondry-auth" }
bondry-core = { version = "0.2.0", path = "../../contract/bondry-core" }
bondry-delivery-store = { version = "0.2.0", path = "../../contract/bondry-delivery-store" }
bondry-store-sqlcipher = { version = "0.2.0", path = "../../store/bondry-store-sqlcipher" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
