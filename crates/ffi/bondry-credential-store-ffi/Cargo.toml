[package]
name = "bondry-credential-store-ffi"
description = "Versioned C ABI for Bondry credential storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
bondry-credential-store-unix = { version = "0.3.0", path = "../../store/bondry-credential-store-unix" }
bondry-secrets = { version = "0.3.0", path = "../../contract/bondry-secrets" }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
