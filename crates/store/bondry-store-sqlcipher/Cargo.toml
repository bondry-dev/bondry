[package]
name = "bondry-store-sqlcipher"
description = "Optional encrypted SQLCipher persistence for Bondry state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
bondry-auth = { version = "0.2.1", path = "../../contract/bondry-auth" }
bondry-core = { version = "0.2.1", path = "../../contract/bondry-core" }
bondry-delivery-store = { version = "0.2.1", path = "../../contract/bondry-delivery-store" }
getrandom.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher", "cache"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl", "cache"] }

[dev-dependencies]
futures = "0.3"
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
