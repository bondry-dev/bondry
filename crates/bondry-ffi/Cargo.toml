[package]
name = "bondry-ffi"
description = "Versioned C ABI for embedding Bondry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
bondry-auth = { path = "../bondry-auth" }
bondry-core = { path = "../bondry-core" }
bondry-store-sqlcipher = { path = "../bondry-store-sqlcipher" }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
