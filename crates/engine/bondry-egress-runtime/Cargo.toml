[package]
name = "bondry-egress-runtime"
description = "Bounded current-thread runtime for Bondry egress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = []
network-io = ["tokio/net"]

[dependencies]
bondry-delivery-store = { version = "0.3.0", path = "../../contract/bondry-delivery-store" }
bondry-egress = { version = "0.3.0", path = "../../egress/bondry-egress" }
bondry-secrets = { version = "0.3.0", path = "../../contract/bondry-secrets" }
bondry-transport = { version = "0.3.0", path = "../../contract/bondry-transport" }
bytes.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
bondry-egress-mcp = { path = "../../egress/bondry-egress-mcp" }
bondry-egress-webhook = { path = "../../egress/bondry-egress-webhook" }
bondry-mcp-proto = { path = "../../proto/bondry-mcp-proto" }
http.workspace = true
serde_json.workspace = true

[lints]
workspace = true
