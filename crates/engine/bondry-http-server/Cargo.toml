[package]
name = "bondry-http-server"
description = "Secure shared local HTTP runtime for Bondry protocol adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["mcp", "rest"]
mcp = ["dep:bondry-mcp-proto"]
rest = ["dep:bondry-rest-proto"]
unix-socket = ["dep:nix"]

[dependencies]
base64.workspace = true
bondry-core = { version = "0.2.1", path = "../../contract/bondry-core" }
bondry-mcp-proto = { version = "0.2.1", path = "../../proto/bondry-mcp-proto", optional = true }
bondry-rest-proto = { version = "0.2.1", path = "../../proto/bondry-rest-proto", optional = true }
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util.workspace = true
nix = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
