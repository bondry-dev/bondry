name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +1.90.0 fmt --all --check
      - name: Lint
        run: cargo +1.90.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo +1.90.0 test --workspace --all-features --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.90.0 doc --workspace --all-features --no-deps --locked

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check workspace
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked

  apple:
    name: Apple
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - name: Install Apple build tools
        run: |
          brew install actionlint ripgrep
          .github/scripts/install-shellcheck.sh
      - name: Install Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          rustup default 1.90.0
          rustup target add \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios
          cargo install --locked --version 0.9.1 --features cli cargo-about
      - name: Verify Apple build tools
        run: |
          set -eu
          for command in \
            actionlint \
            cargo \
            cargo-about \
            lipo \
            rg \
            rustc \
            shellcheck \
            swift \
            xcodebuild \
            xcrun
          do
            command -v "$command" > /dev/null || {
              printf 'Required Apple build tool is unavailable: %s\n' "$command" >&2
              exit 1
            }
          done
      - name: Check workflows
        run: actionlint .github/workflows/*.yml
      - name: Check shell scripts
        run: shellcheck .github/scripts/*.sh apple/scripts/*.sh
      - name: Check Swift formatting
        run: swift format lint --recursive --strict Package.swift apple/Package.swift apple/Distribution/Package.release.swift apple/Sources apple/Tests apple/IntegrationTests/KeychainProbe/Sources
      - name: Test Rust on Apple
        run: cargo test --workspace --all-features --locked
      - name: Test Swift
        run: swift test --package-path apple
      - name: Build and verify XCFramework
        run: apple/scripts/build-xcframework.sh
