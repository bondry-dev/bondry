name: Nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  full:
    name: Full workspace and dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
      - name: Restore Rust cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/advisory-db
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-rust-1.90.0-nightly-nextest-0.9.128-audit-0.22.2-deny-0.20.2-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.90.0-nightly-nextest-0.9.128-audit-0.22.2-deny-0.20.2-
      - name: Install tools
        run: |
          cargo nextest --version 2>/dev/null | grep -F 'cargo-nextest 0.9.128' > /dev/null || \
            cargo +1.90.0 install cargo-nextest --locked --version 0.9.128
          cargo audit --version 2>/dev/null | grep -F '0.22.2' > /dev/null || \
            cargo +1.90.0 install cargo-audit --locked --version 0.22.2
          cargo deny --version 2>/dev/null | grep -F 'cargo-deny 0.20.2' > /dev/null || \
            cargo +1.90.0 install cargo-deny --locked --version 0.20.2
      - name: Check formatting
        run: cargo +1.90.0 fmt --all --check
      - name: Run architecture gates
        run: cargo +1.90.0 xtask gate
      - name: Test workspace
        run: cargo +1.90.0 nextest run --workspace --all-features --locked
      - name: Lint workspace
        run: cargo +1.90.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.90.0 doc --workspace --all-features --no-deps --locked
      - name: Audit advisories
        run: cargo audit
      - name: Check dependency policy
        run: cargo deny check
      - name: Test against self-hosted ntfy
        env:
          NTFY_ARCHIVE_SHA256: 56459cc96110d27f1d952351b7ea2883b894a122ca4cc2339c841003c61c138b
          NTFY_VERSION: 2.26.3
        run: |
          set -euo pipefail
          ntfy_directory="$RUNNER_TEMP/ntfy"
          ntfy_archive="$ntfy_directory/ntfy.tar.gz"
          ntfy_log="$ntfy_directory/server.log"
          mkdir -p "$ntfy_directory"
          curl --fail --location --retry 3 \
            "https://github.com/binwiederhier/ntfy/releases/download/v$NTFY_VERSION/ntfy_${NTFY_VERSION}_linux_amd64.tar.gz" \
            --output "$ntfy_archive"
          printf '%s  %s\n' "$NTFY_ARCHIVE_SHA256" "$ntfy_archive" | sha256sum --check
          tar --extract --gzip --file "$ntfy_archive" --directory "$ntfy_directory"
          ntfy_binary="$ntfy_directory/ntfy_${NTFY_VERSION}_linux_amd64/ntfy"
          "$ntfy_binary" serve --listen-http 127.0.0.1:18080 > "$ntfy_log" 2>&1 &
          ntfy_pid=$!
          cleanup() {
            status=$?
            kill "$ntfy_pid" 2>/dev/null || true
            wait "$ntfy_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              cat "$ntfy_log"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/v1/health \
              | grep -q '"healthy":true'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              printf 'ntfy did not become healthy.\n' >&2
              exit 1
            fi
            sleep 1
          done
          BONDRY_NTFY_BASE_URL=http://127.0.0.1:18080 \
          BONDRY_NTFY_TOPIC=bondry-nightly \
            cargo +1.90.0 test --locked -p bondry-egress-e2e \
              tests::self_hosted_ntfy_accepts_url_template_delivery -- --ignored --exact
      - name: Report dependency drift
        run: cargo update --dry-run

  egress-size:
    name: Rust egress linked size
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Restore Rust cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-rust-1.90.0-egress-size-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.90.0-egress-size-
      - name: Enforce linked size ceiling
        run: scripts/measure-egress-size.sh

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Restore MSRV cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-rust-1.85.0-msrv-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.85.0-msrv-
      - name: Check workspace
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked

  swift-http-parser-fuzz:
    name: Swift HTTP parser fuzz
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - name: Install pinned libFuzzer toolchain
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install llvm@19
      - name: Fuzz bounded HTTP parser
        env:
          ASAN_OPTIONS: quarantine_size_mb=64:malloc_context_size=20
          BONDRY_FUZZ_SECONDS: "60"
        run: apple/scripts/run-http-parser-fuzz.sh
      - name: Upload fuzz crash artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-http-parser-fuzz-artifacts
          path: target/apple-fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 30
