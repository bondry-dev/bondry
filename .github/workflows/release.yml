name: Prepare Release
run-name: Prepare v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric semantic version without a v prefix
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: Build and verify
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Validate release request
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$REPOSITORY_VISIBILITY" != public ]; then
            printf 'Releases require a public repository for public provenance attestations.\n' >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            printf 'Release preparation must run from the main branch.\n' >&2
            exit 1
          fi
          if ! printf '%s\n' "$VERSION" | awk -F. '
            function component(value) { return value == "0" || value ~ /^[1-9][0-9]*$/ }
            NF == 3 && component($1) && component($2) && component($3) { valid = 1 }
            END { exit !valid }
          '; then
            printf 'Version must be a numeric semantic version without a prefix.\n' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            printf 'Tag v%s already exists.\n' "$VERSION" >&2
            exit 1
          fi
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - name: Install release tools
        run: |
          sh .github/scripts/install-homebrew-tools.sh actionlint gh jq
          .github/scripts/install-shellcheck.sh
      - name: Install Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          rustup default 1.90.0
          rustup target add \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios
          cargo install --locked --version 0.9.1 --features cli cargo-about
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2
      - name: Verify release tools
        run: |
          set -eu
          for command in \
            actionlint \
            awk \
            cargo \
            cargo-about \
            cargo-audit \
            cargo-deny \
            cmp \
            cp \
            gh \
            git \
            jq \
            lipo \
            nm \
            rustc \
            sed \
            shasum \
            shellcheck \
            strings \
            swift \
            unzip \
            xcodebuild \
            xcrun \
            zip
          do
            command -v "$command" > /dev/null || {
              printf 'Required release tool is unavailable: %s\n' "$command" >&2
              exit 1
            }
          done
      - name: Validate workspace version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! cargo metadata --no-deps --format-version 1 \
            | jq -e --arg version "$VERSION" 'all(.packages[]; .version == $version)' > /dev/null; then
            printf 'Every workspace package must match release version %s.\n' "$VERSION" >&2
            exit 1
          fi
      - name: Run release checks
        run: |
          actionlint .github/workflows/*.yml
          cargo fmt --all --check
          cargo xtask gate
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo audit
          cargo deny check
          scripts/measure-egress-size.sh
          swift format lint --recursive --strict Package.swift apple/Package.swift apple/Fuzz/Package.swift apple/Distribution/Package.release.swift apple/Fuzz/Sources apple/Sources apple/Tests apple/IntegrationTests
          swift test --package-path apple
          shellcheck .github/scripts/*.sh apple/scripts/*.sh scripts/*.sh
      - name: Build release artifact
        run: SOURCE_DATE_EPOCH=946684800 apple/scripts/build-xcframework.sh
      - name: Upload prepared binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bondry-build-${{ inputs.version }}
          path: |
            target/apple/distribution/BondryRuntime.xcframework.zip
            target/apple/distribution/BondryRuntime.xcframework.zip.sha256
            target/apple/distribution/BondryLocalServer.xcframework.zip
            target/apple/distribution/BondryLocalServer.xcframework.zip.sha256
            target/apple/distribution/BondryEgress.xcframework.zip
            target/apple/distribution/BondryEgress.xcframework.zip.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  prepare:
    name: Prepare manifest and tag
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - name: Install preparation tools
        run: sh .github/scripts/install-homebrew-tools.sh gh jq
      - name: Download prepared binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bondry-build-${{ inputs.version }}
          path: ${{ runner.temp }}/release
      - name: Prepare release commit
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          runtime_archive="$RUNNER_TEMP/release/BondryRuntime.xcframework.zip"
          local_server_archive="$RUNNER_TEMP/release/BondryLocalServer.xcframework.zip"
          egress_archive="$RUNNER_TEMP/release/BondryEgress.xcframework.zip"
          runtime_checksum=$(sed -n '1p' "$runtime_archive.sha256")
          local_server_checksum=$(sed -n '1p' "$local_server_archive.sha256")
          egress_checksum=$(sed -n '1p' "$egress_archive.sha256")
          if ! printf '%s\n%s\n%s\n' "$runtime_checksum" "$local_server_checksum" "$egress_checksum" \
            | awk 'length != 64 || !/^[0-9a-f]+$/ { invalid = 1 } END { exit invalid }'; then
            printf 'A prepared artifact checksum is invalid.\n' >&2
            exit 1
          fi
          actual_runtime_checksum=$(swift package compute-checksum "$runtime_archive")
          actual_local_server_checksum=$(swift package compute-checksum "$local_server_archive")
          actual_egress_checksum=$(swift package compute-checksum "$egress_archive")
          if [ "$actual_runtime_checksum" != "$runtime_checksum" ] || \
             [ "$actual_local_server_checksum" != "$local_server_checksum" ] || \
             [ "$actual_egress_checksum" != "$egress_checksum" ]; then
            printf 'A prepared artifact does not match its checksum file.\n' >&2
            exit 1
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            printf 'The main branch changed during release preparation.\n' >&2
            exit 1
          fi
          apple/scripts/render-release-package.sh \
            "$VERSION" \
            "$runtime_checksum" \
            "$local_server_checksum" \
            "$egress_checksum" \
            Package.swift
          swift package dump-package > /dev/null
          git diff --check
          git config user.name Cocoa
          git config user.email i@uwucocoa.moe
          git add Package.swift
          if ! git diff --cached --quiet; then
            git commit -m "release: prepare v$VERSION"
          fi
          release_commit=$(git rev-parse HEAD)
          git tag --annotate "v$VERSION" --message "Bondry v$VERSION"
          jq -n \
            --arg version "$VERSION" \
            --arg runtime_checksum "$runtime_checksum" \
            --arg local_server_checksum "$local_server_checksum" \
            --arg egress_checksum "$egress_checksum" \
            --arg source_commit "$GITHUB_SHA" \
            --arg release_commit "$release_commit" \
            --arg preparation_run_id "$GITHUB_RUN_ID" \
            '{
              version: $version,
              runtime_checksum: $runtime_checksum,
              local_server_checksum: $local_server_checksum,
              egress_checksum: $egress_checksum,
              source_commit: $source_commit,
              release_commit: $release_commit,
              preparation_run_id: $preparation_run_id
            }' > "$RUNNER_TEMP/release/release-metadata.json"
          {
            printf 'runtime_checksum=%s\n' "$runtime_checksum"
            printf 'local_server_checksum=%s\n' "$local_server_checksum"
            printf 'egress_checksum=%s\n' "$egress_checksum"
            printf 'release_commit=%s\n' "$release_commit"
          } >> "$GITHUB_OUTPUT"
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bondry-release-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/release/BondryRuntime.xcframework.zip
            ${{ runner.temp }}/release/BondryRuntime.xcframework.zip.sha256
            ${{ runner.temp }}/release/BondryLocalServer.xcframework.zip
            ${{ runner.temp }}/release/BondryLocalServer.xcframework.zip.sha256
            ${{ runner.temp }}/release/BondryEgress.xcframework.zip
            ${{ runner.temp }}/release/BondryEgress.xcframework.zip.sha256
            ${{ runner.temp }}/release/release-metadata.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Push release commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"
      - name: Queue publication
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_SERVER_CHECKSUM: ${{ steps.release.outputs.local_server_checksum }}
          EGRESS_CHECKSUM: ${{ steps.release.outputs.egress_checksum }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RUNTIME_CHECKSUM: ${{ steps.release.outputs.runtime_checksum }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run publish-release.yml \
            --ref "v$VERSION" \
            --raw-field version="$VERSION" \
            --raw-field preparation_run_id="$GITHUB_RUN_ID" \
            --raw-field runtime_checksum="$RUNTIME_CHECKSUM" \
            --raw-field local_server_checksum="$LOCAL_SERVER_CHECKSUM" \
            --raw-field egress_checksum="$EGRESS_CHECKSUM" \
            --raw-field release_commit="$RELEASE_COMMIT"
