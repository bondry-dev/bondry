name: Publish Release
run-name: Publish v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric semantic version without a v prefix
        required: true
        type: string
      preparation_run_id:
        description: Prepare Release workflow run ID
        required: true
        type: string
      runtime_checksum:
        description: SwiftPM checksum of BondryRuntime
        required: true
        type: string
      local_server_checksum:
        description: SwiftPM checksum of BondryLocalServer
        required: true
        type: string
      release_commit:
        description: Commit referenced by the release tag
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish prepared artifact
    runs-on: macos-26
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: refs/tags/v${{ inputs.version }}
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - name: Install publication tools
        run: sh .github/scripts/install-homebrew-tools.sh gh jq
      - name: Verify publication tools
        run: |
          set -eu
          for command in awk cmp gh git jq sed shasum swift unzip; do
            command -v "$command" > /dev/null || {
              printf 'Required publication tool is unavailable: %s\n' "$command" >&2
              exit 1
            }
          done
      - name: Validate publication request
        env:
          LOCAL_SERVER_CHECKSUM: ${{ inputs.local_server_checksum }}
          PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RUNTIME_CHECKSUM: ${{ inputs.runtime_checksum }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if ! printf '%s\n' "$VERSION" | awk -F. '
            function component(value) { return value == "0" || value ~ /^[1-9][0-9]*$/ }
            NF == 3 && component($1) && component($2) && component($3) { valid = 1 }
            END { exit !valid }
          '; then
            printf 'Version must be a numeric semantic version without a prefix.\n' >&2
            exit 1
          fi
          if ! printf '%s\n' "$PREPARATION_RUN_ID" | awk '/^[1-9][0-9]*$/ { valid = 1 } END { exit !valid }'; then
            printf 'Preparation run ID must be a positive integer.\n' >&2
            exit 1
          fi
          if ! printf '%s\n%s\n' "$RUNTIME_CHECKSUM" "$LOCAL_SERVER_CHECKSUM" \
            | awk 'length != 64 || !/^[0-9a-f]+$/ { invalid = 1 } END { exit invalid }'; then
            printf 'Each checksum must contain 64 lowercase hexadecimal characters.\n' >&2
            exit 1
          fi
          if ! printf '%s\n' "$RELEASE_COMMIT" | awk 'length == 40 && /^[0-9a-f]+$/ { valid = 1 } END { exit !valid }'; then
            printf 'Release commit must contain 40 lowercase hexadecimal characters.\n' >&2
            exit 1
          fi
          case "$GITHUB_REF" in
            "refs/tags/v$VERSION" | refs/heads/main) ;;
            *)
              printf 'Publication must run from tag v%s or the main recovery path.\n' "$VERSION" >&2
              exit 1
              ;;
          esac
          if [ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]; then
            printf 'The checked-out release tag does not match the requested commit.\n' >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/v$VERSION")" != tag ]; then
            printf 'Release tag v%s must be annotated.\n' "$VERSION" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            printf 'The release commit is not on the main branch.\n' >&2
            exit 1
          fi
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bondry-release-${{ inputs.version }}
          path: ${{ runner.temp }}/release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preparation_run_id }}
      - name: Verify prepared release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_SERVER_CHECKSUM: ${{ inputs.local_server_checksum }}
          PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RUNTIME_CHECKSUM: ${{ inputs.runtime_checksum }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          runtime_archive="$RUNNER_TEMP/release/BondryRuntime.xcframework.zip"
          local_server_archive="$RUNNER_TEMP/release/BondryLocalServer.xcframework.zip"
          metadata="$RUNNER_TEMP/release/release-metadata.json"
          run_data=$(gh run view "$PREPARATION_RUN_ID" \
            --json conclusion,event,headBranch,headSha,workflowName)
          if ! printf '%s\n' "$run_data" | jq -e '
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .headBranch == "main" and
            .workflowName == "Prepare Release"
          ' > /dev/null; then
            printf 'The preparation workflow run is not a successful main-branch preparation.\n' >&2
            exit 1
          fi
          source_commit=$(printf '%s\n' "$run_data" | jq -r .headSha)
          if ! jq -e \
            --arg version "$VERSION" \
            --arg runtime_checksum "$RUNTIME_CHECKSUM" \
            --arg local_server_checksum "$LOCAL_SERVER_CHECKSUM" \
            --arg source_commit "$source_commit" \
            --arg release_commit "$RELEASE_COMMIT" \
            --arg preparation_run_id "$PREPARATION_RUN_ID" \
            '.version == $version and
             .runtime_checksum == $runtime_checksum and
             .local_server_checksum == $local_server_checksum and
             .source_commit == $source_commit and
             .release_commit == $release_commit and
             .preparation_run_id == $preparation_run_id' \
            "$metadata" > /dev/null; then
            printf 'Release metadata does not match the publication request.\n' >&2
            exit 1
          fi
          recorded_runtime_checksum=$(sed -n '1p' "$runtime_archive.sha256")
          recorded_local_server_checksum=$(sed -n '1p' "$local_server_archive.sha256")
          actual_runtime_checksum=$(swift package compute-checksum "$runtime_archive")
          actual_local_server_checksum=$(swift package compute-checksum "$local_server_archive")
          sha256_runtime_checksum=$(shasum -a 256 "$runtime_archive" | awk '{ print $1 }')
          sha256_local_server_checksum=$(shasum -a 256 "$local_server_archive" | awk '{ print $1 }')
          if [ "$recorded_runtime_checksum" != "$RUNTIME_CHECKSUM" ] || \
             [ "$actual_runtime_checksum" != "$RUNTIME_CHECKSUM" ] || \
             [ "$sha256_runtime_checksum" != "$RUNTIME_CHECKSUM" ] || \
             [ "$recorded_local_server_checksum" != "$LOCAL_SERVER_CHECKSUM" ] || \
             [ "$actual_local_server_checksum" != "$LOCAL_SERVER_CHECKSUM" ] || \
             [ "$sha256_local_server_checksum" != "$LOCAL_SERVER_CHECKSUM" ]; then
            printf 'A prepared release artifact checksum does not match the manifest.\n' >&2
            exit 1
          fi
          apple/scripts/render-release-package.sh \
            "$VERSION" \
            "$RUNTIME_CHECKSUM" \
            "$LOCAL_SERVER_CHECKSUM" \
            "$RUNNER_TEMP/Package.swift"
          cmp Package.swift "$RUNNER_TEMP/Package.swift"
          swift package dump-package > /dev/null
          unzip -tq "$runtime_archive"
          unzip -tq "$local_server_archive"
          release_state=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || printf 'missing')
          case "$release_state" in
            true | missing)
              printf 'published=false\n' >> "$GITHUB_OUTPUT"
              ;;
            false)
              printf 'published=true\n' >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf 'Release v%s has an unknown state.\n' "$VERSION" >&2
              exit 1
              ;;
          esac
      - name: Verify existing attestation
        if: github.sha != inputs.release_commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          for archive in \
            "$RUNNER_TEMP/release/BondryRuntime.xcframework.zip" \
            "$RUNNER_TEMP/release/BondryLocalServer.xcframework.zip"
          do
            attestation="$archive.attestation.json"
            gh attestation verify \
              "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --format json > "$attestation"
            jq -e --arg ref "refs/tags/v$VERSION" '
              any(.[];
                .verificationResult.statement.predicate.buildDefinition.externalParameters.workflow.ref == $ref
              )
            ' "$attestation" > /dev/null
          done
      - name: Attest release artifact
        if: github.sha == inputs.release_commit
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            ${{ runner.temp }}/release/BondryRuntime.xcframework.zip
            ${{ runner.temp }}/release/BondryLocalServer.xcframework.zip
      - name: Upload draft release
        if: steps.release.outputs.published != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ inputs.version }}
          name: Bondry v${{ inputs.version }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/release/BondryRuntime.xcframework.zip
            ${{ runner.temp }}/release/BondryRuntime.xcframework.zip.sha256
            ${{ runner.temp }}/release/BondryLocalServer.xcframework.zip
            ${{ runner.temp }}/release/BondryLocalServer.xcframework.zip.sha256
          fail_on_unmatched_files: true
          preserve_order: true
      - name: Publish draft release
        if: steps.release.outputs.published != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ inputs.version }}
          name: Bondry v${{ inputs.version }}
          draft: false
          prerelease: true
      - name: Verify published release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          published_directory="$RUNNER_TEMP/published"
          release_data=$(gh release view "v$VERSION" \
            --json assets,isDraft,isPrerelease,tagName)
          if ! printf '%s\n' "$release_data" | jq -e \
            --arg tag "v$VERSION" '
              .isDraft == false and
              .isPrerelease == true and
              .tagName == $tag and
              ([.assets[].name] | sort) == [
                "BondryLocalServer.xcframework.zip",
                "BondryLocalServer.xcframework.zip.sha256",
                "BondryRuntime.xcframework.zip",
                "BondryRuntime.xcframework.zip.sha256"
              ]
            ' > /dev/null; then
            printf 'The published release metadata or assets are incomplete.\n' >&2
            exit 1
          fi
          mkdir -p "$published_directory"
          gh release download "v$VERSION" \
            --dir "$published_directory" \
            --pattern 'Bondry*.xcframework.zip*'
          for asset in \
            BondryRuntime.xcframework.zip \
            BondryRuntime.xcframework.zip.sha256 \
            BondryLocalServer.xcframework.zip \
            BondryLocalServer.xcframework.zip.sha256
          do
            cmp "$RUNNER_TEMP/release/$asset" "$published_directory/$asset"
          done
