[workspace]
members = [
    "crates/bondry-auth",
    "crates/bondry-core",
    "crates/bondry-ffi",
    "crates/bondry-store-sqlcipher",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/bondry-dev/bondry"

[workspace.dependencies]
base64 = "0.23"
getrandom = "0.4"
rusqlite = { version = "0.40", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
tempfile = "3.27"
thiserror = "2.0"
zeroize = "1.9"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
