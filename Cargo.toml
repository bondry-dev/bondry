[workspace]
members = ["crates/bondry-core"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/bondry-dev/bondry"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
