[workspace]
members = [
    "crates/contract/bondry-auth",
    "crates/contract/bondry-core",
    "crates/contract/bondry-delivery-store",
    "crates/contract/bondry-secrets",
    "crates/contract/bondry-transport",
    "crates/egress/bondry-egress",
    "crates/egress/bondry-egress-mcp",
    "crates/egress/bondry-egress-webhook",
    "crates/engine/bondry-egress-runtime",
    "crates/engine/bondry-http-server",
    "crates/engine/bondry-transport-net",
    "crates/ffi/bondry-egress-ffi",
    "crates/ffi/bondry-local-server-ffi",
    "crates/ffi/bondry-runtime-ffi",
    "crates/ffi/bondry-webhook-ingress-ffi",
    "crates/proto/bondry-mcp-proto",
    "crates/proto/bondry-rest-proto",
    "crates/proto/bondry-webhook-ingress",
    "crates/proto/bondry-webhook-verify",
    "crates/store/bondry-store-sqlcipher",
    "itests/server-bench",
    "itests/server-e2e",
    "itests/egress-e2e",
    "itests/egress-mcp-e2e",
    "itests/transport-e2e",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/bondry-dev/bondry"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "0.23"
bytes = "1.10"
getrandom = "0.4"
hmac = "0.13"
http = "1.3"
http-body-util = "0.1.5"
hyper = "1.11"
hyper-util = { version = "0.1.18", features = ["tokio"] }
jsonschema = { version = "=0.49.9", default-features = false }
rusqlite = { version = "0.40", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.31", default-features = false, features = ["socket", "user"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
sha2 = "0.11"
stats_alloc = "0.1.10"
subtle = "2.6"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tower-service = "0.3.3"
zeroize = "1.9"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bondry_legacy_layout)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
